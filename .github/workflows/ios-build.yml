name: Build iOS (nube)

# Compila la app iOS en un runner macOS de GitHub (trae Xcode + Swift PM).
# Así puedes construir iOS SIN tener un Mac compatible localmente.
#
# Por defecto hace un build SIN FIRMA (verifica que compila; no necesita cuenta
# de Apple). Para generar un .ipa instalable / subir a TestFlight, hace falta una
# cuenta de Apple Developer y añadir los secretos de firma — ver ios/README-iOS.md.
# Solo a pedido. Antes corria en cada push a main que tocara src/, o sea en
# casi todos los despliegues, y viene fallando desde hace tiempo: mandaba un
# correo de "Run failed" por cada deploy sin que nadie estuviera trabajando
# en iOS.
#
# Falla resolviendo dependencias de Swift, no en el codigo del proyecto:
# capacitor-social-login pide alamofire 5.11.2..<6.0.0, y esas versiones
# exigen tools 6.3.0, mas nuevo que el Xcode del runner que estaba fijado.
#
# Para sacar iOS: Actions -> Build iOS (nube) -> Run workflow. Si vuelve a
# fallar por lo mismo, hay que esperar a que el runner traiga un Xcode mas
# nuevo o bajar la version de capacitor-social-login.
on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: frontend/gym-aplication

jobs:
  build-unsigned:
    runs-on: macos-latest # el Xcode mas nuevo disponible: las dependencias de Swift lo piden
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/gym-aplication/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Angular)
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar iOS (sin firma, simulador)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  # ─────────────────────────────────────────────────────────────────────────
  # PASO SIGUIENTE (opcional): generar un .ipa firmado y subirlo a TestFlight.
  # Requiere una cuenta de Apple Developer (99 USD/año) y configurar como
  # secretos del repo: el certificado de distribución, el perfil de
  # aprovisionamiento y las claves de App Store Connect. Descomenta y completa
  # cuando tengas la cuenta. Guía en ios/README-iOS.md.
