name: Publicar imagen Docker (frontend)

# Construye y publica la imagen del frontend en GitHub Container Registry (GHCR)
# en cada push a main que toque el frontend. NO necesitas Docker en tu PC: todo
# corre en el runner.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # En el monorepo cada imagen lleva sufijo para no pisarse con la del backend:
  # ghcr.io/CristianAnacona/GimnacioApp/frontend
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Igual que en backend-docker.yml: el driver "docker" por defecto no sabe
      # exportar caché y buildx aborta con "Cache export is not supported".
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: frontend/gym-aplication
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
