name: Publicar imagen Docker (backend)

# Construye y publica la imagen del backend en GitHub Container Registry (GHCR)
# en cada push a main que toque el backend. NO necesitas Docker en tu PC: todo
# corre en el runner.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

env:
  REGISTRY: ghcr.io
  # En el monorepo cada imagen lleva sufijo para no pisarse con la del frontend:
  # ghcr.io/CristianAnacona/GimnacioApp/backend
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # necesario para publicar en GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin esto el build usa el driver "docker" por defecto, que NO sabe
      # exportar caché: los pasos de abajo piden cache-to type=gha y buildx
      # aborta con "Cache export is not supported for the docker driver".
      # setup-buildx crea un builder con driver docker-container, que sí puede.
      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token automático, no configuras nada

      - name: Calcular tags y labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
