<!-- La clase `campana-zona` marca el territorio propio: un click dentro no
     cierra el panel, uno fuera sí. -->
<div class="campana-zona">

  <button type="button" (click)="alternar()" class="icono-navbar" [class.agitando]="agitando"
    [attr.aria-label]="noLeidos > 0 ? noLeidos + ' avisos sin leer' : 'Avisos'"
    [attr.aria-expanded]="abierto" title="Avisos">
    <!-- Emoji en vez del trazo monocromo: sobre la barra clara el contorno
         gris se veía apagado, y así acompaña a los iconos del menú. -->
    <span class="icono-emoji" aria-hidden="true">🔔</span>

    @if (noLeidos > 0) {
      <span class="campana-globo" aria-hidden="true">{{ noLeidos > 9 ? '9+' : noLeidos }}</span>
    }
  </button>

  @if (abierto) {
  <div class="campana-panel" role="dialog" aria-label="Avisos">

    <div class="campana-cabecera">
      <span>Avisos</span>
      <button type="button" (click)="cerrar()" aria-label="Cerrar avisos">✕</button>
    </div>

    <div class="campana-lista">
      @if (vacio) {
        <p class="campana-vacio">
          <span class="campana-vacio-icono" aria-hidden="true">✅</span>
          Todo en orden. No hay nada pendiente.
        </p>
      } @else {
        @for (grupo of grupos; track grupo.nombre) {
          <p class="campana-grupo">{{ grupo.nombre }}</p>

          @for (aviso of grupo.avisos; track aviso.id) {
            <button type="button" class="campana-item" [class]="'nivel-' + aviso.nivel" (click)="ir(aviso)">
              <span class="campana-icono" aria-hidden="true">{{ aviso.icono }}</span>
              <span class="campana-texto">
                <span class="campana-titulo">{{ aviso.titulo }}</span>
                <span class="campana-detalle">{{ aviso.detalle }}</span>
              </span>
              <span class="campana-flecha" aria-hidden="true">›</span>
            </button>
          }
        }
      }
    </div>
  </div>
  }
</div>
