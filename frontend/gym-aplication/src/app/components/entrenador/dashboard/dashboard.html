<div class="min-h-screen bg-slate-100">
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏋️</span>
        <div>
          <h1 class="text-lg font-semibold leading-tight">Panel del Entrenador</h1>
          <p class="text-xs text-slate-300 leading-tight">Hola, {{ username }}</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a routerLink="/entrenador/socios" routerLinkActive="ring-2 ring-white/40"
           class="rounded-lg bg-slate-700 hover:bg-slate-600 px-3 py-2 text-sm font-medium transition-colors">
          👥 <span class="hidden sm:inline">Mis socios</span>
        </a>
        <a routerLink="/entrenador/agenda" routerLinkActive="ring-2 ring-white/40"
           class="rounded-lg bg-slate-700 hover:bg-slate-600 px-3 py-2 text-sm font-medium transition-colors">
          📅 <span class="hidden sm:inline">Mi agenda</span>
        </a>
        <button
          type="button"
          (click)="alternarTema()"
          [title]="esOscuro ? 'Modo claro' : 'Modo oscuro'"
          class="rounded-lg bg-slate-700 hover:bg-slate-600 px-3 py-2 text-sm transition-colors">
          {{ esOscuro ? '☀️' : '🌙' }}
        </button>
        <button
          type="button"
          (click)="logout()"
          class="flex items-center gap-1 rounded-lg bg-slate-700 hover:bg-slate-600 px-3 py-2 text-sm font-medium transition-colors"
        >
          <span>🚪</span>
          <span class="hidden sm:inline">Salir</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-4">
    <router-outlet></router-outlet>
  </main>
</div>
