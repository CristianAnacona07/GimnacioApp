<!-- Mismo armazón que el panel del admin y el del socio: la barra lateral
     compartida, que ya sabe armar su menú según el rol y los permisos. -->
<div class="min-h-screen bg-slate-100">
  <app-navbar (menuAbiertoCambio)="menuAbierto = $event"></app-navbar>

  <!-- El menú se dibuja superpuesto: sin este corrimiento tapaba las
       tarjetas de la izquierda (mismo caso que el panel del admin). -->
  <div class="p-4 max-w-7xl mx-auto transition-[padding] duration-300"
       [class.lg:pl-72]="menuAbierto">

    <!-- Oculto en celular: ahi el saludo ya lo pone la barra de arriba (la
         franja con el punto verde), y salia dos veces. En pantalla ancha esa
         franja no existe, asi que este es el unico. -->
    <h2 class="hidden md:block text-2xl font-bold text-slate-800 mb-6">
      Bienvenido, {{ username }}
    </h2>

    <div>
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
