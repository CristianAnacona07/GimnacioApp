<div class="page">

  <a class="volver" routerLink="/admin/configuracion">← Configuración</a>
  <h2 class="page-title">👤 Mi perfil</h2>
  <p class="page-sub">Tus datos y la seguridad de tu acceso.</p>

  <div class="card">
    <p class="card-title">Mis datos</p>

    <span class="campo__label">Foto</span>
    <div class="logo-zona">
      @if (fotoUrl) {
        <img class="logo-preview" [src]="fotoUrl" alt="Mi foto" />
      } @else {
        <div class="logo-vacio" [style.background]="'var(--btn-degradado)'"
             [style.color]="'var(--btn-texto)'">{{ (nombre || '?')[0] }}</div>
      }
      <app-selector-foto (elegida)="usarFoto($event)" />
    </div>

    <label class="campo">
      <span class="campo__label">Nombre</span>
      <input class="input" type="text" maxlength="60" [(ngModel)]="nombre" name="nombrePerfil" />
    </label>
    <label class="campo">
      <span class="campo__label">Cédula</span>
      <input class="input" type="text" maxlength="20" [(ngModel)]="identificacion" name="identificacion" />
    </label>
    <label class="campo">
      <span class="campo__label">Teléfono</span>
      <input class="input" type="tel" maxlength="20" [(ngModel)]="telefono" name="telefono" />
    </label>
    <label class="campo">
      <span class="campo__label">Correo</span>
      <input class="input" type="text" [value]="admin?.email || ''" disabled />
    </label>
    <p class="card-hint">El correo identifica tu cuenta y no se puede cambiar desde aquí.</p>
    <button class="btn" (click)="guardarPerfil()" [disabled]="guardandoPerfil || !hayCambios">
      {{ guardandoPerfil ? 'Guardando…' : 'Guardar datos' }}
    </button>
  </div>

  <div class="card">
    <p class="card-title">Cambiar contraseña</p>
    <label class="campo">
      <span class="campo__label">Contraseña actual</span>
      <input class="input" type="password" autocomplete="current-password"
             [(ngModel)]="actual" name="actual" />
    </label>
    <label class="campo">
      <span class="campo__label">Nueva contraseña</span>
      <input class="input" type="password" autocomplete="new-password"
             [(ngModel)]="nueva" name="nueva" />
    </label>
    <label class="campo">
      <span class="campo__label">Repite la nueva</span>
      <input class="input" type="password" autocomplete="new-password"
             [(ngModel)]="repetir" name="repetir" />
    </label>
    <p class="card-hint">Mínimo 8 caracteres.</p>
    <button class="btn" (click)="cambiarPassword()" [disabled]="cambiandoPass">
      {{ cambiandoPass ? 'Cambiando…' : 'Cambiar contraseña' }}
    </button>
  </div>


</div>
