@if (role === 'admin') {
<div class="min-h-screen bg-slate-100">
  <app-navbar (menuAbiertoCambio)="menuAbierto = $event"></app-navbar>

  <!-- El menú se dibuja superpuesto (ver navbar.css): sin este corrimiento
       tapaba las tarjetas de la izquierda, porque este panel es ancho y su
       contenido empieza antes que el del socio. -->
  <div class="p-4 max-w-7xl mx-auto transition-[padding] duration-300"
       [class.lg:pl-72]="menuAbierto">

    <h2 class="text-2xl font-bold text-slate-800 mb-6">
      Bienvenido, {{ username }}
    </h2>

  <div>
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
}
