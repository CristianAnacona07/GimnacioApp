<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Snake Gym</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El ?v= no es decoración: los iconos se sirven con nombre fijo, así que
       un navegador que ya bajó el logo viejo se lo queda. Subir el número es
       lo único que lo obliga a pedirlo de nuevo. Al cambiar el logo, subilo. -->
  <link rel="icon" type="image/png" href="icons/favicon.png?v=3">
  <!-- iOS lo busca antes que el manifest, y no usa webp para el icono de inicio. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="manifest" href="manifest.webmanifest?v=3">
</head>

</body>
</html>
