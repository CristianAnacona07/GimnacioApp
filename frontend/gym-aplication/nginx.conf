server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Permite el flujo de login por popup de Google (mismo que en dev/Vercel)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Compresión de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La hoja para descargar la app, en una dirección que se pueda dictar.
    #
    # Es el mismo volante que se imprime y se pega en recepción, pero también
    # se comparte por WhatsApp — y ahí un enlace largo de otro dominio queda
    # feo y da desconfianza. El archivo vive en public/, así que se sirve solo;
    # esto es únicamente para que responda sin el .html a la vista.
    location = /instalar {
        default_type text/html;
        alias /usr/share/nginx/html/instalar.html;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # Descarga del APK, con dirección corta y sin nombres de nadie.
    #
    # El QR del volante apunta acá. Antes iba directo al release de GitHub, que
    # deja la cuenta y el repositorio a la vista de cualquiera que lo escanee.
    #
    # El tipo de contenido no es decorativo: sin él Android trata el archivo
    # como algo genérico y ofrece "guardar" en vez de "instalar".
    location = /descargar {
        alias /usr/share/nginx/html/app/snake-gym.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=\"snake-gym.apk\"" always;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # El mismo archivo por su ruta real, por si alguien la guardó.
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # Iconos y manifest: cache CORTA, y `^~` para ganarle a la regla de abajo.
    #
    # Esa regla marca todo .png/.webp como `immutable` durante un año, y para
    # los archivos de Angular está bien: llevan un hash en el nombre, así que
    # un cambio es un archivo nuevo. Los iconos NO: se llaman siempre igual.
    # Marcarlos inmutables le dice al navegador "no vuelvas a preguntar nunca",
    # y así fue: al cambiar el logo, quien ya tenía el viejo se lo quedó — en
    # la pestaña, en el acceso directo del escritorio y en el iPhone. Se veía
    # el logo viejo aunque el servidor tuviera el nuevo, y no había forma de
    # forzarlo desde acá.
    location ^~ /icons/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
    location ^~ /assets/icons/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Assets con hash en el nombre → cache larga e inmutable
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El service worker y su manifiesto NO deben cachearse (para recibir updates)
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location = /ngsw.json      { add_header Cache-Control "no-cache"; }
    location = /index.html     { add_header Cache-Control "no-cache"; }

    # Manifiesto de la actualización por aire.
    #
    # El plugin del APK pregunta con POST (manda datos de la app en el cuerpo),
    # y nginx contesta 405 a un POST sobre un archivo estático: por eso la app
    # nunca se enteraba de que había versión nueva. Este bloque lo genera el
    # Dockerfile con la versión y el checksum de esta compilación, y responde
    # con "return", que sirve para cualquier método.
    include /etc/nginx/ota-updates.conf;

    # SPA: cualquier ruta desconocida → index.html (routing de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
