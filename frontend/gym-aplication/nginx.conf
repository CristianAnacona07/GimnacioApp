server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Permite el flujo de login por popup de Google (mismo que en dev/Vercel)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Compresión de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre → cache larga e inmutable
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El service worker y su manifiesto NO deben cachearse (para recibir updates)
    location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
    location = /ngsw.json      { add_header Cache-Control "no-cache"; }
    location = /index.html     { add_header Cache-Control "no-cache"; }

    # Manifiesto de la actualización por aire.
    #
    # El plugin del APK pregunta con POST (manda datos de la app en el cuerpo),
    # y nginx contesta 405 a un POST sobre un archivo estático: por eso la app
    # nunca se enteraba de que había versión nueva. Este bloque lo genera el
    # Dockerfile con la versión y el checksum de esta compilación, y responde
    # con "return", que sirve para cualquier método.
    include /etc/nginx/ota-updates.conf;

    # SPA: cualquier ruta desconocida → index.html (routing de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
