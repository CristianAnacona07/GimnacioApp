<section>
  <h2 class="text-xl font-bold text-slate-800 mb-4">Mis socios</h2>

  <!-- Cargando -->
  <div *ngIf="cargando" class="space-y-3">
    <div *ngFor="let i of [1, 2, 3]" class="animate-pulse flex items-center gap-3 rounded-xl bg-white p-4 shadow-sm">
      <div class="h-12 w-12 rounded-full bg-slate-200"></div>
      <div class="flex-1 space-y-2">
        <div class="h-3 w-1/3 rounded bg-slate-200"></div>
        <div class="h-3 w-1/2 rounded bg-slate-200"></div>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="!cargando && error" class="rounded-xl bg-white p-6 text-center shadow-sm">
    <p class="text-3xl mb-2">⚠️</p>
    <p class="text-slate-600 mb-4">Ocurrió un error al cargar tus socios.</p>
    <button
      type="button"
      (click)="cargar()"
      class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 transition-colors"
    >
      Reintentar
    </button>
  </div>

  <!-- Vacío -->
  <div *ngIf="!cargando && !error && socios.length === 0" class="rounded-xl bg-white p-8 text-center shadow-sm">
    <p class="text-4xl mb-2">🧑‍🤝‍🧑</p>
    <p class="text-slate-600">Todavía no tienes socios asignados.</p>
  </div>

  <!-- Lista -->
  <ul *ngIf="!cargando && !error && socios.length > 0" class="space-y-3">
    <li *ngFor="let socio of socios">
      <a
        [routerLink]="['../socio', socio._id]"
        class="flex items-center gap-3 rounded-xl bg-white p-4 shadow-sm hover:shadow-md hover:bg-slate-50 transition-all"
      >
        <img
          [src]="avatar(socio)"
          (error)="onErrorFoto($event, socio)"
          alt="Foto de {{ socio.nombre }}"
          class="h-12 w-12 rounded-full object-cover"
        />
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-slate-800 truncate">{{ socio.nombre || 'Socio' }}</p>
          <p class="text-sm text-slate-500 truncate">{{ socio.email }}</p>
        </div>
        <span class="text-slate-400">›</span>
      </a>
    </li>
  </ul>
</section>
