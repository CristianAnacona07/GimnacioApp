# Servicios de APOYO para desarrollo local. No despliega la app: solo levanta
# herramientas que evitan depender de servicios reales mientras se prueba.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#
# Mailpit captura TODO el correo que envíe el backend y lo muestra en una
# bandeja web; no entrega nada a destinatarios reales, así que se puede probar
# el alta de administradores o la recuperación de contraseña con direcciones
# inventadas y sin miedo a molestar a nadie.
#
# Bandeja web:  http://localhost:8026   (propia de este proyecto)
# SMTP:         localhost:1026   → en backend/.env: SMTP_HOST=127.0.0.1  SMTP_PORT=1026
#
# Con SMTP_HOST definido el backend ignora Gmail por completo (ver helpers/email.js),
# así que en desarrollo no hacen falta EMAIL_USER/EMAIL_PASS.

# Nombre del proyecto en Docker: sin esto Compose usaría el de la carpeta desde
# la que se lanza ("backend"), que no dice nada y se confunde con los demás
# proyectos del equipo. Así los contenedores quedan agrupados bajo "gimnacio-app".
name: gimnacio-app

services:
  mailpit:
    image: axllent/mailpit:latest
    # Sin container_name a proposito: Compose lo nombra <proyecto>-mailpit-1, que
    # es unico en el equipo. Un nombre fijo "mailpit" chocaria con el contenedor
    # del mismo nombre que ya tienen otros proyectos.
    # Puertos PROPIOS de este proyecto (1026/8026), no los estándar de Mailpit:
    # en este equipo conviven otros proyectos con su propio Mailpit en 1025/8025
    # y cada uno debe tener su bandeja. Dentro del contenedor siempre son 1025/8025.
    # Se pueden cambiar con MAILPIT_SMTP_PORT / MAILPIT_UI_PORT.
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8026}:8025"   # interfaz web
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1 # acepta cualquier credencial (o ninguna)
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped
