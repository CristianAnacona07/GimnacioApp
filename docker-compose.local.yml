# Pila COMPLETA del proyecto en contenedores: base de datos, correo, API y web.
# Construye desde el código de este repositorio (no descarga imágenes de GHCR),
# así que sirve tanto para desarrollar como para desplegar en un servidor propio
# el día que no se quiera depender de Vercel.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f backend
#   docker compose -f docker-compose.local.yml down          (añade -v para borrar la BD)
#
# Solo el correo, sin levantar el resto:
#   docker compose -f docker-compose.local.yml up -d mailpit
#
# Antes del primer arranque: copia .env.docker.example a .env y pon un JWT_SECRET.
#
# Puertos del HOST (elegidos para no chocar con los otros proyectos del equipo):
#   web        http://localhost:8090
#   API        http://localhost:10000
#   correo     http://localhost:8026        (SMTP 1026)
#   Postgres   postgresql://localhost:5433  (para psql/DBeaver; la app no lo usa desde fuera)
#   archivos   http://localhost:9010        (consola web en http://localhost:9011)
name: gimnacio-app

services:
  # ── Base de datos ──────────────────────────────────────────────────────
  # Los datos viven en el volumen `postgres_datos`, así que sobreviven a
  # `down` y solo se borran con `down -v`.
  postgres:
    image: postgres:17
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymdb}
      POSTGRES_USER: ${POSTGRES_USER:-gymapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env}
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymapp} -d ${POSTGRES_DB:-gymdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Correo de desarrollo ───────────────────────────────────────────────
  # Captura todo lo que envíe la API y lo muestra en una bandeja web; no
  # entrega nada a destinatarios reales. Sin container_name a propósito: un
  # nombre fijo "mailpit" chocaría con el de otros proyectos del equipo.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1026}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8026}:8025"   # interfaz web
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

  # ── Almacén de archivos ────────────────────────────────────────────────
  # Guarda las fotos de la página pública de cada gimnasio. Habla el protocolo
  # de S3, así que el backend usa el mismo código aquí, en el VPS y en cualquier
  # almacén en la nube: solo cambian las variables S3_* del backend.
  # Consola web para ver/borrar archivos a mano: http://localhost:9011
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # 9010/9011 en vez de los 9000/9001 de fábrica: son puertos muy comunes y
      # otros proyectos del equipo podrían reclamarlos.
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gimnacio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gimnacio-local-1234}
    volumes:
      - minio_datos:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── API ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-10000}:10000"
    environment:
      NODE_ENV: production
      PORT: 10000
      # Dentro de la red de Compose los servicios se llaman por su nombre.
      # Para usar un Postgres externo en vez del contenedor, define DATABASE_URL en el .env.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-gymapp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gymdb}}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el .env}
      # Correo por Mailpit: con SMTP_HOST definido, Gmail se ignora por completo.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@kodiak.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      # 'localhost' para que <slug>.localhost se comporte como lo hará
      # <slug>.midominio.com en el servidor (CORS y validación de dominios).
      TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-localhost}
      # Almacén de archivos (protocolo S3). S3_PUBLIC_URL es con la que el
      # navegador pide las fotos, así que va con el puerto del HOST, no el de
      # dentro de la red de Compose.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9010}
      S3_BUCKET: ${S3_BUCKET:-gimnacio}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-gimnacio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-gimnacio-local-1234}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Web ────────────────────────────────────────────────────────────────
  # Angular se compila DENTRO de la imagen y la URL de la API queda grabada en
  # el bundle, así que hay que pasarla como argumento de build. Si cambias
  # API_URL, hay que reconstruir: `up -d --build frontend`.
  frontend:
    build:
      context: ./frontend/gym-aplication
      args:
        API_URL: ${API_URL:-http://localhost:10000}
        # Con esto, <slug>.localhost:8090 abre la página de ese gimnasio igual
        # que hará <slug>.midominio.com en el servidor.
        TENANT_ROOT_DOMAIN: ${TENANT_ROOT_DOMAIN:-localhost}
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_datos:
  minio_datos:
